name: deploy-gh-pages

# Optional GitHub Actions Pages deploy. This repository's Pages site is
# configured for the legacy `main /docs` build, which already deploys every
# push; running this workflow on the same push races that build and produces
# a false "No artifacts named github-pages" failure.
#
# Kept for forkers who switch Settings -> Pages -> Source to "GitHub Actions".
# In that setup, re-enable the push trigger below.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
